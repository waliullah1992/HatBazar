<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HatBazar</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { margin: 0; padding: 15px; background-color: #f4f6f9; color: #333; }
    
    header { text-align: center; margin-bottom: 20px; }
    header h1 { color: #2c3e50; margin-bottom: 5px; }
    
    /* Layout styling */
    .container { max-width: 1000px; margin: 0 auto; }
    
    /* Form Section */
    .form-container { background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 30px; }
    .form-container h3 { margin-top: 0; color: #27ae60; }
    
    input, select, button { width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
    button.add-btn { background-color: #27ae60; color: white; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; }
    button.add-btn:hover { background-color: #219150; }
    
    /* Grid layout for products */
    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
    
    /* Product Card */
    .product-card { background: white; border-radius: 8px; padding: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); display: flex; flex-direction: column; justify-content: space-between; }
    .product-card img { width: 100%; height: 160px; object-fit: cover; border-radius: 6px; margin-bottom: 10px; }
    .product-card h3 { margin: 5px 0; font-size: 16px; color: #2c3e50; }
    .product-card p { margin: 4px 0; font-size: 13px; color: #666; }
    .product-card .price { font-weight: bold; color: #e67e22; font-size: 15px; }
    
    .btn-group { display: flex; gap: 8px; margin-top: 10px; }
    .wa-btn { background-color: #25D366; color: white; border: none; text-decoration: none; text-align: center; padding: 8px; border-radius: 5px; font-size: 12px; flex: 1; font-weight: bold; }
    .delete-btn { background-color: #e74c3c; color: white; border: none; padding: 8px; border-radius: 5px; font-size: 12px; cursor: pointer; flex: 1; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>HatBazar</h1>
      <p>বাংলাদেশের অনলাইন ক্রয়-বিক্রয় প্ল্যাটফর্ম</p>
    </header>

    <!-- পণ্য যোগ করার ফরম -->
    <div class="form-container">
      <h3>নতুন পণ্য যোগ করুন</h3>
      <form id="product-form">
        <input type="text" id="p-name" placeholder="পণ্যের নাম" required>
        <select id="p-category" required>
          <option value="">ক্যাটাগরি নির্বাচন করুন</option>
          <option value="গাড়ি">🚗 গাড়ি</option>
          <option value="জমি ও ফ্ল্যাট">🏠 জমি ও ফ্ল্যাট</option>
          <option value="মোবাইল">📱 মোবাইল</option>
          <option value="কম্পিউটার">💻 কম্পিউটার</option>
          <option value="পোশাক">👕 পোশাক</option>
          <option value="কৃষি">🌾 কৃষি</option>
          <option value="শিল্প ও মেশিন">🏭 শিল্প ও মেশিন</option>
        </select>
        <input type="number" id="p-price" placeholder="দাম (টাকা)" required>
        <input type="text" id="p-phone" placeholder="আপনার মোবাইল/WhatsApp নম্বর" required>
        <input type="file" id="p-image" accept="image/*" required>
        <button type="submit" class="add-btn">পণ্য যোগ করুন</button>
      </form>
    </div>

    <!-- যোগ করা পণ্য প্রদর্শনের জায়গা -->
    <h2>পণ্য তালিকা</h2>
    <div id="product-list" class="product-grid"></div>
  </div>

  <script>
    const form = document.getElementById('product-form');
    const productList = document.getElementById('product-list');

    // LocalStorage থেকে পূর্বে সেভ করা প্রোডাক্ট লোড করা
    document.addEventListener('DOMContentLoaded', displayProducts);

    form.addEventListener('submit', function(e) {
      e.preventDefault();

      const name = document.getElementById('p-name').value;
      const category = document.getElementById('p-category').value;
      const price = document.getElementById('p-price').value;
      const phone = document.getElementById('p-phone').value;
      const imageInput = document.getElementById('p-image');

      const reader = new FileReader();
      reader.onload = function() {
        const imageUrl = reader.result; // ছবিকে সেভযোগ্য ফরম্যাটে রূপান্তর

        const product = {
          id: Date.now(),
          name,
          category,
          price,
          phone,
          image: imageUrl
        };

        saveProductToStorage(product);
        displayProducts();
        form.reset();
      };

      if (imageInput.files[0]) {
        reader.readAsDataURL(imageInput.files[0]);
      }
    });

    // লোকাল স্টোরেজে তথ্য সেভ করা
    function saveProductToStorage(product) {
      let products = JSON.parse(localStorage.getItem('products')) || [];
      products.push(product);
      localStorage.setItem('products', JSON.stringify(products));
    }

    // স্ক্রিনে পণ্য প্রদর্শন করা
    function displayProducts() {
      productList.innerHTML = '';
      let products = JSON.parse(localStorage.getItem('products')) || [];

      products.forEach(product => {
        const card = document.createElement('div');
        card.className = 'product-card';
        card.innerHTML = `
          <div>
            <img src="${product.image}" alt="${product.name}">
            <h3>${product.name}</h3>
            <p><strong>বিভাগ:</strong> ${product.category}</p>
            <p class="price">দাম: ৳${product.price}</p>
          </div>
          <div class="btn-group">
            <a href="https://wa.me/88${product.phone}?text=আমি%20${product.name}%20পণ্যটি%20কিনতে%20আগ্রহী" target="_blank" class="wa-btn">WhatsApp</a>
            <button class="delete-btn" onclick="deleteProduct(${product.id})">মুছে ফেলুন</button>
          </div>
        `;
        productList.appendChild(card);
      });
    }

    // প্রোডাক্ট ডিলিট করা
    function deleteProduct(id) {
      let products = JSON.parse(localStorage.getItem('products')) || [];
      products = products.filter(product => product.id !== id);
      localStorage.setItem('products', JSON.stringify(products));
      displayProducts();
    }
  </script>

</body>
</html>
