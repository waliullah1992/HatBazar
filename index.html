<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>হাটবাজার (HatBazar)</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f4; }
        header { background: #1a3038; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        header input { padding: 8px; border-radius: 4px; border: none; width: 200px; }
        header button { background: #27ae60; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; }
        
        .category-bar { background: #2c3e50; padding: 10px; text-align: center; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
        .cat-btn { background: #34495e; color: white; border: none; padding: 6px 12px; border-radius: 20px; cursor: pointer; }
        .cat-btn.active { background: #e67e22; }

        .banner { background: #eef2f3; text-align: center; padding: 25px; }
        .btn-sell { background: #e67e22; color: white; border: none; padding: 10px 18px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        
        .container { max-width: 1000px; margin: 20px auto; padding: 0 15px; }
        .products { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .card { background: white; padding: 15px; border-radius: 8px; text-align: center; width: 220px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card img { width: 100%; height: 160px; object-fit: cover; border-radius: 5px; }
        .card h5 { margin: 10px 0 5px; font-size: 16px; }
        .card p { color: #e74c3c; font-weight: bold; margin: 5px 0 5px; }
        .seller-phone { font-size: 12px; color: #555; margin-bottom: 10px; }
        .btn-buy { background: #27ae60; color: white; border: none; padding: 8px 15px; cursor: pointer; border-radius: 4px; width: 100%; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: white; padding: 20px; border-radius: 8px; width: 90%; max-width: 400px; position: relative; }
        .modal-content input, .modal-content select, .modal-content textarea { width: 100%; padding: 8px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; }
        .close-btn { position: absolute; top: 10px; right: 15px; font-size: 20px; cursor: pointer; color: #888; }
        
        footer { background: #1a3038; color: white; text-align: center; padding: 15px; margin-top: 40px; }
    </style>
</head>
<body>

    <header>
        <h2 style="margin: 0;">হাটবাজার (HatBazar)</h2>
        <div>
            <input type="text" id="searchInput" onkeyup="filterProducts()" placeholder="পণ্য খুঁজুন...">
            <button id="cart-btn" onclick="openCheckout()">কার্ট (0)</button>
        </div>
    </header>

    <div class="category-bar">
        <button class="cat-btn active" onclick="filterCategory('সব')">সব পণ্য</button>
        <button class="cat-btn" onclick="filterCategory('ইলেক্ট্রনিক্স')">ইলেক্ট্রনিক্স</button>
        <button class="cat-btn" onclick="filterCategory('পোশাক')">পোশাক</button>
        <button class="cat-btn" onclick="filterCategory('অন্যান্য')">অন্যান্য</button>
    </div>

    <div class="banner">
        <h3>সবচেয়ে কম দামে সেরা পণ্য কিনুন ও বিক্রি করুন</h3>
        <button class="btn-sell" onclick="openModal('sellModal')">+ আপনার পণ্য বিক্রি করুন</button>
    </div>

    <div class="container">
        <h3>সর্বশেষ পণ্যসমূহ</h3>
        <div class="products" id="productList"></div>
    </div>

    <!-- Sell Product Modal -->
    <div class="modal" id="sellModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('sellModal')">&times;</span>
            <h3>পণ্য বিক্রির তথ্য দিন</h3>
            <form onsubmit="addNewProduct(event)">
                <input type="text" id="pName" placeholder="পণ্যের নাম" required>
                <select id="pCategory" required>
                    <option value="ইলেক্ট্রনিক্স">ইলেক্ট্রনিক্স</option>
                    <option value="পোশাক">পোশাক</option>
                    <option value="অন্যান্য">অন্যান্য</option>
                </select>
                <input type="number" id="pPrice" placeholder="মূল্য (টাকা)" required>
                <input type="tel" id="pPhone" placeholder="বিক্রেতার মোবাইল নম্বর" required>
                <input type="url" id="pImg" placeholder="আসল ছবির লিংক (URL)" required>
                <button type="submit" class="btn-sell" style="width: 100%; margin-top: 10px;">পণ্য যোগ করুন</button>
            </form>
        </div>
    </div>

    <!-- Buy Form Modal (Direct Purchase) -->
    <div class="modal" id="buyModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('buyModal')">&times;</span>
            <h3>অর্ডার ফরম</h3>
            <p id="buyProductInfo" style="font-weight: bold; color: #27ae60;"></p>
            <form onsubmit="placeDirectOrder(event)">
                <input type="text" placeholder="আপনার নাম" required>
                <input type="tel" placeholder="আপনার মোবাইল নম্বর" required>
                <textarea rows="3" placeholder="ডেলিভারি ঠিকানা" required></textarea>
                <button type="submit" class="btn-buy" style="width: 100%; margin-top: 10px;">অর্ডার কনফার্ম করুন</button>
            </form>
        </div>
    </div>

    <footer>
        <p>© 2026 HatBazar. সর্বস্বত্ব সংরক্ষিত।</p>
    </footer>

    <script>
        const initialProducts = [
            { name: "স্মার্টফোন", category: "ইলেক্ট্রনিক্স", price: 12000, phone: "01700000000", img: "https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=300" },
            { name: "মেয়েদের থ্রি-পিস", category: "পোশাক", price: 1500, phone: "01800000000", img: "https://images.unsplash.com/photo-1583391733956-3750e0ff4e8b?w=300" }
        ];

        let products = JSON.parse(localStorage.getItem('hatbazar_products')) || initialProducts;
        let cart = JSON.parse(localStorage.getItem('hatbazar_cart')) || [];
        let currentCategory = 'সব';
        let selectedProduct = null;

        function saveAndRender() {
            localStorage.setItem('hatbazar_products', JSON.stringify(products));
            localStorage.setItem('hatbazar_cart', JSON.stringify(cart));
            document.getElementById('cart-btn').innerText = `কার্ট (${cart.length})`;
            renderProducts();
        }

        function renderProducts() {
            const productList = document.getElementById('productList');
            productList.innerHTML = '';
            const filtered = products.filter(p => currentCategory === 'সব' || p.category === currentCategory);

            filtered.forEach(p => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="${p.img}" alt="${p.name}">
                    <h5>${p.name}</h5>
                    <p>৳ ${p.price}</p>
                    <div class="seller-phone">📞 ${p.phone}</div>
                    <button class="btn-buy" onclick="openBuyModal('${p.name}', ${p.price})">কিনুন</button>
                `;
                productList.appendChild(card);
            });
        }

        function openBuyModal(name, price) {
            selectedProduct = { name, price };
            document.getElementById('buyProductInfo').innerText = `পণ্য: ${name} | দাম: ৳ ${price}`;
            openModal('buyModal');
        }

        function placeDirectOrder(event) {
            event.preventDefault();
            alert(`ধন্যবাদ! "${selectedProduct.name}" পণ্যের অর্ডারটি গ্রহণ করা হয়েছে। আমরা শীঘ্রই আপনার নাম্বারে যোগাযোগ করব।`);
            closeModal('buyModal');
            event.target.reset();
        }

        function addNewProduct(event) {
            event.preventDefault();
            const newProd = {
                name: document.getElementById('pName').value,
                category: document.getElementById('pCategory').value,
                price: Number(document.getElementById('pPrice').value),
                phone: document.getElementById('pPhone').value,
                img: document.getElementById('pImg').value
            };
            products.push(newProd);
            saveAndRender();
            closeModal('sellModal');
            alert("আপনার পণ্যটি সফলভাবে সাইটে যুক্ত করা হয়েছে!");
            event.target.reset();
        }

        function filterProducts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.querySelectorAll('.card');
            cards.forEach(card => {
                const title = card.querySelector('h5').innerText.toLowerCase();
                card.style.display = title.includes(query) ? 'block' : 'none';
            });
        }

        function filterCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.toggle('active', btn.innerText.includes(cat) || (cat === 'সব' && btn.innerText.includes('সব')));
            });
            renderProducts();
        }

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        saveAndRender();
    </script>
</body>
</html>
