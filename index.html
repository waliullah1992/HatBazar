<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HatBazar - হাটবাজার অনলাইন শপ</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header>
        <div class="logo">
            <h1>হাটবাজার (HatBazar)</h1>
        </div>

        <nav>
            <input type="text" placeholder="পণ্য খুঁজুন...">
            <button class="cart-btn">
                <i class="fas fa-shopping-cart"></i> কার্ট (0)
            </button>
        </nav>
    </header>

    <section class="hero">
        <h2>সবচেয়ে কম দামে সেরা পণ্য কিনুন ও বিক্রি করুন</h2>
        <button class="btn-sell">+ আপনার পণ্য বিক্রি করুন</button>
    </section>

    <main>
        <h3>সর্বশেষ পণ্যসমূহ</h3>

        <div class="product-grid">

            <div class="product-card">
                <img src="https://placehold.co/150" alt="Product">
                <h4>স্মার্টফোন</h4>
                <p class="price">৳ ১২,০০০</p>
                <button onclick="addToCart('স্মার্টফোন')">কিনুন</button>
            </div>

            <div class="product-card">
                <img src="https://placehold.co/150" alt="Product">
                <h4>মেয়েদের থ্রি-পিস</h4>
                <p class="price">৳ ১,৫০০</p>
                <button onclick="addToCart('মেয়েদের থ্রি-পিস')">কিনুন</button>
            </div>

        </div>
    </main>

    <footer>
        <p>&copy; 2026 HatBazar. সর্বস্বত্ব সংরক্ষিত।</p>
    </footer>

    <!-- আপনার JavaScript -->
    <script src="script.js"></script>

    <!-- Firebase -->

        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-analytics.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDy3huu8PKT4vbwFtegGRFQC78rzVsF0zE",

        const analytics = getAnalytics(app);

        console.log("HatBazar Firebase Connected Successfully!");
    </script>

</body>
</html>
