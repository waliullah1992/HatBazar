<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HatBazar - আপনার অনলাইন মার্কেট</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

body{
background:#f5f5f5;
font-family:Arial,sans-serif;
}

.product-card{
background:#fff;
border-radius:10px;
padding:10px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
transition:.3s;
}

.product-card:hover{
transform:translateY(-4px);
}

.btn-orange{
background:#ff6600;
color:#fff;
padding:10px 18px;
border-radius:8px;
font-weight:bold;
}

.btn-orange:hover{
background:#e65c00;
}

</style>

</head>

<body>

<!-- Top Bar -->

<div class="bg-gray-900 text-white text-sm py-2">

<div class="max-w-7xl mx-auto px-4 flex justify-between">

<span>
স্বাগতম HatBazar-এ
</span>

<div class="space-x-4">

<a href="#">সহায়তা</a>

<a href="#">ট্র্যাক অর্ডার</a>

<a href="#">ভাষা: বাংলা</a>

</div>

</div>

</div>

<!-- Header -->

<header class="bg-orange-600 text-white shadow">

<div class="max-w-7xl mx-auto px-4 py-4 flex items-center gap-4">

<h1 class="text-3xl font-bold">
Hat<span class="text-yellow-300">Bazar</span>
</h1>

<div class="flex-1">

<div class="flex">

<input
id="searchBox"
type="text"
placeholder="পণ্য খুঁজুন..."
class="w-full px-4 py-2 text-black rounded-l-lg">

<button
onclick="searchProduct()"
class="bg-yellow-400 px-6 rounded-r-lg">

<i class="fa fa-search"></i>

</button>

</div>

</div>

<button onclick="toggleWishlist()">

<i class="fa-regular fa-heart text-2xl"></i>

</button>

<button onclick="toggleCart()" class="relative">

<i class="fa-solid fa-cart-shopping text-2xl"></i>

<span id="cartCount"
class="absolute -top-2 -right-2 bg-yellow-300 text-black rounded-full px-2 text-xs">

0

</span>

</button>

</div>

</header>
