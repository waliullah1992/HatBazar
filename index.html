<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>হাটবাজার (HatBazar)</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f4; }
        header { background: #1a3038; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        header input { padding: 8px; border-radius: 4px; border: none; width: 200px; }
        header button { background: #27ae60; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; }
        
        .banner { background: #eef2f3; text-align: center; padding: 25px; }
        .btn-sell { background: #e67e22; color: white; border: none; padding: 10px 18px; cursor: pointer; border-radius: 4px; text-decoration: none; font-weight: bold; }
        
        .container { max-width: 1000px; margin: 20px auto; padding: 0 15px; }
        .products { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .card { background: white; padding: 15px; border-radius: 8px; text-align: center; width: 220px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card img { width: 100%; height: 160px; object-fit: cover; border-radius: 5px; }
        .card h5 { margin: 10px 0 5px; font-size: 16px; }
        .card p { color: #e74c3c; font-weight: bold; margin: 5px 0 10px; }
        .btn-buy { background: #27ae60; color: white; border: none; padding: 8px 15px; cursor: pointer; border-radius: 4px; width: 100%; }
        
        /* Modal Popup Design */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: white; padding: 20px; border-radius: 8px; width: 90%; max-width: 400px; position: relative; }
        .modal-content h3 { margin-top: 0; }
        .modal-content input { width: 100%; padding: 8px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; }
        .close-btn { position: absolute; top: 10px; right: 15px; font-size: 20px; cursor: pointer; color: #888; }
        
        footer { background: #1a3038; color: white; text-align: center; padding: 15px; margin-top: 40px; }
    </style>
</head>
<body>

    <header>
        <h2 style="margin: 0;">হাটবাজার (HatBazar)</h2>
        <div>
            <input type="text" id="searchInput" onkeyup="filterProducts()" placeholder="পণ্য খুঁজুন...">
            <button id="cart-btn" onclick="openCheckout()">কার্ট (0)</button>
        </div>
    </header>

    <div class="banner">
        <h3>সবচেয়ে কম দামে সেরা পণ্য কিনুন ও বিক্রি করুন</h3>
        <button class="btn-sell" onclick="openModal('sellModal')">+ আপনার পণ্য বিক্রি করুন</button>
    </div>

    <div class="container">
        <h3>সর্বশেষ পণ্যসমূহ</h3>
        <div class="products" id="productList">
            <!-- Product 1 -->
            <div class="card">
                <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=300" alt="স্মার্টফোন">
                <h5>স্মার্টফোন</h5>
                <p>৳ ১২,০০০</p>
                <button class="btn-buy" onclick="addToCart('স্মার্টফোন', 12000)">কিনুন</button>
            </div>

            <!-- Product 2 -->
            <div class="card">
                <img src="https://images.unsplash.com/photo-1583391733956-3750e0ff4e8b?w=300" alt="মেয়েদের থ্রি-পিস">
                <h5>মেয়েদের থ্রি-পিস</h5>
                <p>৳ ১,৫০০</p>
                <button class="btn-buy" onclick="addToCart('মেয়েদের থ্রি-পিস', 1500)">কিনুন</button>
            </div>
        </div>
    </div>

    <!-- Sell Product Modal -->
    <div class="modal" id="sellModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('sellModal')">&times;</span>
            <h3>পণ্য বিক্রির তথ্য দিন</h3>
            <form onsubmit="addNewProduct(event)">
                <input type="text" id="pName" placeholder="পণ্যের নাম" required>
                <input type="number" id="pPrice" placeholder="মূল্য (টাকা)" required>
                <input type="url" id="pImg" placeholder="ছবির লিংক (URL)" required>
                <button type="submit" class="btn-sell" style="width: 100%; margin-top: 10px;">পণ্য যোগ করুন</button>
            </form>
        </div>
    </div>

    <!-- Order / Checkout Modal -->
    <div class="modal" id="checkoutModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('checkoutModal')">&times;</span>
            <h3>অর্ডার কনফার্ম করুন</h3>
            <p id="cartDetails">আপনার কার্ট খালি!</p>
            <form onsubmit="placeOrder(event)">
                <input type="text" placeholder="আপনার নাম" required>
                <input type="tel" placeholder="মোবাইল নম্বর" required>
                <input type="text" placeholder="ডেলিভারি ঠিকানা" required>
                <button type="submit" class="btn-buy" style="width: 100%; margin-top: 10px;">অর্ডার সম্পন্ন করুন</button>
            </form>
        </div>
    </div>

    <footer>
        <p>© 2026 HatBazar. সর্বস্বত্ব সংরক্ষিত।</p>
    </footer>

    <script>
        let cart = [];

        // Add to Cart Logic
        function addToCart(name, price) {
            cart.push({ name, price });
            document.getElementById('cart-btn').innerText = `কার্ট (${cart.length})`;
            alert(name + " সফলভাবে কার্টে যোগ করা হয়েছে!");
        }

        // Open & Close Modals
        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        // Dynamic Product Add
        function addNewProduct(event) {
            event.preventDefault();
            const name = document.getElementById('pName').value;
            const price = document.getElementById('pPrice').value;
            const img = document.getElementById('pImg').value;

            const productList = document.getElementById('productList');
            const newCard = document.createElement('div');
            newCard.className = 'card';
            newCard.innerHTML = `
                <img src="${img}" alt="${name}">
                <h5>${name}</h5>
                <p>৳ ${price}</p>
                <button class="btn-buy" onclick="addToCart('${name}', ${price})">কিনুন</button>
            `;
            productList.appendChild(newCard);
            
            closeModal('sellModal');
            alert("আপনার পণ্যটি সফলভাবে সাইটে যুক্ত করা হয়েছে!");
            event.target.reset();
        }

        // Search Filter
        function filterProducts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.querySelectorAll('.card');
            cards.forEach(card => {
                const title = card.querySelector('h5').innerText.toLowerCase();
                card.style.display = title.includes(query) ? 'block' : 'none';
            });
        }

        // Open Checkout Page
        function openCheckout() {
            if(cart.length === 0) {
                alert("আপনার কার্ট খালি!");
                return;
            }
            let total = cart.reduce((sum, item) => sum + item.price, 0);
            document.getElementById('cartDetails').innerText = `মোট পণ্য: ${cart.length} টি | সর্বমোট দাম: ৳ ${total}`;
            openModal('checkoutModal');
        }

        // Place Order Logic
        function placeOrder(event) {
            event.preventDefault();
            alert("ধন্যবাদ! আপনার অর্ডারটি গ্রহণ করা হয়েছে। আমরা শীঘ্রই যোগাযোগ করব।");
            cart = [];
            document.getElementById('cart-btn').innerText = `কার্ট (0)`;
            closeModal('checkoutModal');
        }
    </script>
</body>
</html>
