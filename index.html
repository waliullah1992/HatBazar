<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HatBazar</title>
  <style>
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
    .modal-content { background: #fff; margin: 10% auto; padding: 20px; width: 90%; max-width: 400px; position: relative; border-radius: 8px; }
    .close-btn { position: absolute; right: 15px; top: 10px; cursor: pointer; font-size: 24px; }
    .card { border: 1px solid #ddd; padding: 10px; margin: 10px 0; border-radius: 5px; }
    .card img { max-width: 100%; height: auto; }
    .featured-badge { background: gold; padding: 2px 5px; font-size: 12px; }
  </style>
</head>
<body>

  <!-- Buy Form Modal -->
  <div class="modal" id="buyModal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal('buyModal')">&times;</span>
      <h3>অর্ডার ফর্ম</h3>
      <p id="buyProductInfo" style="font-weight: bold; color: #27ae60; margin-bottom: 5px;"></p>
      <p style="font-size: 12px; color: #e74c3c; margin-top: 0;">*> ৮০ টাকা হোম ডেলিভারি চার্জ প্রযোজ্য</p>

      <div class="payment-info">
        <b>বিকাশ/নগদ সেন্ড মানি করুন:</b> 01627340645<br>
        ডেলিভারি চার্জ ৮০ টাকা অগ্রিম দিয়ে Transaction ID দিন।
      </div>

      <form onsubmit="placeDirectOrder(event)">
        <input type="text" placeholder="আপনার নাম" required><br><br>
        <input type="tel" placeholder="আপনার মোবাইল নম্বর" required><br><br>
        <textarea rows="2" placeholder="পূর্ণাঙ্গ ডেলিভারি ঠিকানা" required></textarea><br><br>
        <input type="text" placeholder="বিকাশ/নগদ TrxID (ট্রানজেকশন আইডি)" required><br><br>
        <button type="submit" class="btn-buy" style="width: 100%; margin-top: 10px;">অর্ডার কনফার্ম করুন</button>
      </form>
    </div>
  </div>

  <div id="productList"></div>

  <footer>
    <p>&copy; 2026 HatBazar. সর্বস্বত্ব সংরক্ষিত</p>
  </footer>

  <script>
    const defaultImage = "https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=300";

    const initialProducts = [
      { name: "Samsung Galaxy S23", category: "ইলেকট্রনিক্স", price: 85000, phone: "01627340645", img: "https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=300" },
      { name: "মেয়েদের থ্রি-পিস", category: "পোশাক", price: 1500, phone: "01627340645", img: "https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=300" }
    ];

    let products = JSON.parse(localStorage.getItem('hatbazar_v4_products')) || initialProducts;
    let currentCategory = 'সব';
    let selectedProduct = null;

    function saveAndRender() {
      localStorage.setItem('hatbazar_v4_products', JSON.stringify(products));
      renderProducts();
    }

    function renderProducts() {
      const productList = document.getElementById('productList');
      productList.innerHTML = '';

      let sortedProducts = [...products].sort((a, b) => (b.featured ? 1 : 0) - (a.featured ? 1 : 0));
      const filtered = sortedProducts.filter(p => currentCategory === 'সব' || p.category === currentCategory);

      filtered.forEach(p => {
        const card = document.createElement('div');
        card.className = `card ${p.featured ? 'featured' : ''}`;
        const imgSrc = (p.img && p.img.startsWith('http')) ? p.img : defaultImage;

        card.innerHTML = `
          ${p.featured ? '<span class="featured-badge">Featured</span>' : ''}
          <img src="${imgSrc}" alt="${p.name}" onerror="this.src='${defaultImage}'">
          <h5>${p.name}</h5>
          <p>৳ ${p.price}</p>
          <div class="seller-phone">📞 ${p.phone}</div>
          <button class="btn-buy" onclick="openBuyModal('${p.name}', ${p.price})">কিনুন</button>
        `;
        productList.appendChild(card);
      });
    }

    function openBuyModal(productName, price) {
      selectedProduct = { name: productName, price: price };
      document.getElementById('buyProductInfo').innerText = `${productName} - ৳${price}`;
      document.getElementById('buyModal').style.display = 'block';
    }

    function closeModal(modalId) {
      document.getElementById(modalId).style.display = 'none';
    }

    function placeDirectOrder(event) {
      event.preventDefault();
      alert('আপনার অর্ডারটি সফলভাবে গ্রহণ করা হয়েছে!');
      closeModal('buyModal');
    }

    renderProducts();
  </script>

</body>
</html>
