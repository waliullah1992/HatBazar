<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HatBazar</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f4f9;
            padding: 15px;
        }

        .product-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            max-width: 600px;
            margin: 0 auto;
        }

        .product-card {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 10px;
            position: relative;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .featured-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background-color: #ffc107;
            color: #000;
            font-size: 10px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 3px;
        }

        .product-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 5px;
            margin-bottom: 8px;
        }

        .product-title {
            font-size: 13px;
            font-weight: bold;
            color: #333;
            margin-bottom: 4px;
        }

        .product-price {
            font-size: 14px;
            color: #2c3e50;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .product-phone {
            font-size: 11px;
            color: #555;
            margin-bottom: 8px;
        }

        .buy-btn {
            width: 100%;
            background-color: #007bff;
            color: white;
            border: none;
            padding: 6px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
        }

        footer {
            text-align: center;
            margin-top: 20px;
            font-size: 11px;
            color: #666;
        }
    </style>
</head>
<body>

    <div class="product-container">
        <!-- প্রোডাক্ট ১ -->
        <div class="product-card">
            <span class="featured-badge">Featured</span>
            <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=400" alt="Samsung Galaxy S23">
            <div class="product-title">Samsung Galaxy S23</div>
            <div class="product-price">৳ 85000</div>
            <div class="product-phone">📞 01627340645</div>
            <button class="buy-btn">কিনুন</button>
        </div>

        <!-- প্রোডাক্ট ২ -->
        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1583391733956-3750e0ff4e8b?w=400" alt="মেয়েদের থ্রি-পিস">
            <div class="product-title">মেয়েদের থ্রি-পিস</div>
            <div class="product-price">৳ 1500</div>
            <div class="product-phone">📞 01627340645</div>
            <button class="buy-btn">কিনুন</button>
        </div>
    </div>

    <footer>
        © 2026 HatBazar. সর্বস্বত্ব সংরক্ষিত
    </footer>

</body>
</html>
